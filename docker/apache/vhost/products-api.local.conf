<VirtualHost *:80>
    ServerName movies-recommend.local
    ServerAlias localhost
    DocumentRoot /var/www/movies-recommend.local

    <FilesMatch \.php$>
        SetHandler "proxy:unix:/run/php/php8.4-fpm.sock|fcgi://localhost"
    </FilesMatch>

    <Directory "/var/www/movies-recommend.local">
        AllowOverride All
        Require all granted
        Options +FollowSymLinks
    </Directory>

    CustomLog /var/log/apache2/movies-recommend.local-access.log combined
    ErrorLog /var/log/apache2/movies-recommend.local-error.log
</VirtualHost>
